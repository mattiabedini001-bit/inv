<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f2a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario">
<title>Inventario</title>
<style>
  :root { --bg:#f4f2ee; --card:#fff; --ink:#1f2a2e; --mute:#6b7478; --line:#e2ded6; --acc:#b9770e; --in:#2e7d4f; --out:#b23b3b; --adj:#3a6ea5; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background:var(--ink); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; }
  header button { background:none; border:1px solid #ffffff55; color:#fff; border-radius:8px; padding:6px 10px; font-size:13px; }
  main { padding:16px 16px calc(90px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; }
  nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav button { flex:1; background:none; border:0; padding:12px 4px; font-size:13px; color:var(--mute); font-weight:600; border-top:3px solid transparent; }
  nav button.on { color:var(--acc); border-top-color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--mute); margin:12px 0 4px; font-weight:600; }
  input, select, textarea { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .btn { width:100%; border:0; border-radius:10px; padding:14px; font:inherit; font-weight:700; color:#fff; background:var(--acc); margin-top:16px; }
  .btn.sec { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; }
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; padding:12px 4px; border-radius:10px; border:1px solid var(--line); background:#fff; font:inherit; font-weight:700; color:var(--mute); }
  .seg button.on[data-t=CARICO] { background:var(--in); color:#fff; border-color:var(--in); }
  .seg button.on[data-t=SCARICO] { background:var(--out); color:#fff; border-color:var(--out); }
  .seg button.on[data-t=RETTIFICA] { background:var(--adj); color:#fff; border-color:var(--adj); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:18px 0 8px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .t { font-weight:600; }
  .row .s { font-size:13px; color:var(--mute); }
  .qty { font-weight:700; font-size:18px; white-space:nowrap; text-align:right; }
  .qty small { font-size:12px; color:var(--mute); font-weight:500; }
  .low { color:var(--out); }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; background:#f7e3e3; color:var(--out); margin-left:6px; }
  .off { opacity:.5; }
  .pos { color:var(--in); } .neg { color:var(--out); }
  .hint { font-size:13px; color:var(--mute); margin-top:6px; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(80px + env(safe-area-inset-bottom)); background:var(--ink); color:#fff; padding:12px 14px; border-radius:10px; text-align:center; display:none; z-index:9; }
  #toast.err { background:var(--out); }
  .center { text-align:center; padding:40px 0; color:var(--mute); }
  #login { max-width:340px; margin:12vh auto 0; padding:0 20px; }
  #login h1 { text-align:center; }
  #pin { text-align:center; font-size:26px; letter-spacing:.3em; }
  .hide { display:none !important; }
  .two { display:flex; gap:10px; } .two > div { flex:1; }
</style>
</head>
<body>

<div id="activate" class="hide" style="max-width:340px;margin:12vh auto 0;padding:0 20px">
  <h1 style="text-align:center">Inventario</h1>
  <div class="card">
    <label for="actKey">Codice o link di attivazione</label>
    <input id="actKey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="hint">Incolla il link che hai ricevuto. Serve una volta sola.</div>
    <button class="btn" id="btnAct">Attiva</button>
  </div>
</div>

<div id="login" class="hide">
  <h1>Inventario</h1>
  <div class="card">
    <label for="pin">PIN personale</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <button class="btn" id="btnLogin">Entra</button>
  </div>
</div>

<div id="app" class="hide">
  <header><h1>Inventario</h1><div><span id="who" style="font-size:13px;margin-right:8px"></span><button id="btnOut">Esci</button></div></header>
  <main id="main"></main>
  <nav>
    <button data-v="mov">Movimento</button>
    <button data-v="stock">Giacenze</button>
    <button data-v="log">Registro</button>
    <button data-v="art">Articoli</button>
  </nav>
</div>
<div id="toast"></div>

<script>
"use strict";
/* Questa pagina non contiene l'indirizzo dello script: arriva dal link di attivazione e resta solo sul telefono. */
let API_URL = "";
const KKEY = "inv_key";
const keyFrom = s => { const m = String(s || "").trim().match(/(?:\/s\/|[#&]k=|^)([A-Za-z0-9_-]{25,200})(?:\/exec)?$/); return m ? m[1] : ""; };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = n => Number(n).toLocaleString("it-IT", { maximumFractionDigits: 2 });
const TKEY = "inv_token";
let S = { user:"", articles:[], movements:[], totalMovements:0 };
let view = "mov", movTipo = "CARICO", movArt = "", editId = null, busy = false;
let filt = { art:"", tipo:"" }, stockQ = "";

const store = {
  get() { try { return localStorage.getItem(TKEY) || ""; } catch (e) { return ""; } },
  set(v) { try { v ? localStorage.setItem(TKEY, v) : localStorage.removeItem(TKEY); } catch (e) {} }
};
let token = store.get();

function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", err ? 4500 : 2200);
}

async function api(action, data) {
  let res;
  try {
    const r = await fetch(API_URL, {
      method: "POST", redirect: "follow", referrerPolicy: "no-referrer",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ action, token }, data || {}))
    });
    res = await r.json();
  } catch (e) { throw new Error("Connessione assente o servizio non raggiungibile."); }
  if (!res.ok) {
    if (res.code === "AUTH") { token = ""; store.set(""); showLogin(); }
    throw new Error(res.error || "Errore");
  }
  return res;
}

function showLogin() { $("app").classList.add("hide"); $("login").classList.remove("hide"); $("pin").value = ""; $("pin").focus(); }
function showApp() { $("login").classList.add("hide"); $("app").classList.remove("hide"); $("who").textContent = S.user; render(); }

async function run(fn) {
  if (busy) return; busy = true;
  document.querySelectorAll("button.btn").forEach(b => b.disabled = true);
  try { await fn(); } catch (e) { toast(e.message, true); }
  busy = false;
  document.querySelectorAll("button.btn").forEach(b => b.disabled = false);
}

$("btnLogin").onclick = () => run(async () => {
  const pin = $("pin").value.trim();
  if (!/^\d{4,12}$/.test(pin)) throw new Error("Inserisci il PIN.");
  const r = await api("login", { pin });
  token = r.token; store.set(token);
  S = await api("state");
  showApp();
});
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") $("btnLogin").click(); });
$("btnOut").onclick = async () => { try { await api("logout"); } catch (e) {} token = ""; store.set(""); showLogin(); };
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { view = b.dataset.v; editId = null; render(); });

const label = a => a.nome + (a.formato ? " - " + a.formato : "");
const active = () => S.articles.filter(a => a.attivo);
const byCat = list => ["Birre", "Materiali"].map(c => [c, list.filter(a => a.categoria === c).sort((x, y) => label(x).localeCompare(label(y), "it"))]).filter(g => g[1].length);
const artOptions = (list, sel, withStock) => byCat(list).map(([c, as]) =>
  `<optgroup label="${esc(c)}">` + as.map(a => `<option value="${esc(a.id)}"${a.id === sel ? " selected" : ""}>${esc(label(a))}${withStock ? " (" + fmt(a.giacenza) + " " + esc(a.unita) + ")" : ""}</option>`).join("") + "</optgroup>").join("");

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  ({ mov: vMov, stock: vStock, log: vLog, art: vArt })[view]();
  window.scrollTo(0, 0);
}

/* ---------- MOVIMENTO ---------- */
function vMov() {
  const list = active();
  if (!list.length) { $("main").innerHTML = `<div class="center">Nessun articolo.<br>Aggiungine uno dalla scheda <b>Articoli</b>.</div>`; return; }
  $("main").innerHTML = `
  <div class="card">
    <div class="seg">${["CARICO", "SCARICO", "RETTIFICA"].map(t => `<button data-t="${t}" class="${t === movTipo ? "on" : ""}">${t[0] + t.slice(1).toLowerCase()}</button>`).join("")}</div>
    <label for="mArt">Articolo</label>
    <select id="mArt"><option value="">Scegli…</option>${artOptions(list, movArt, true)}</select>
    <label for="mQty">Quantità</label>
    <input id="mQty" type="text" inputmode="${movTipo === "RETTIFICA" ? "text" : "decimal"}" autocomplete="off" placeholder="${movTipo === "RETTIFICA" ? "es. -3 oppure 5" : "0"}">
    ${movTipo === "RETTIFICA" ? `<div class="hint">Serve a correggere un errore o una rottura: numero negativo per togliere, positivo per aggiungere.</div>` : ""}
    <label for="mNota">Nota ${movTipo === "RETTIFICA" ? "(obbligatoria)" : "(facoltativa)"}</label>
    <input id="mNota" type="text" maxlength="200" autocomplete="off" placeholder="es. cliente, lotto, motivo">
    <button class="btn" id="mSave">Registra ${movTipo.toLowerCase()}</button>
  </div>
  <h2>Ultimi movimenti</h2><div class="card">${movRows(S.movements.slice(0, 5)) || '<div class="s">Ancora nessun movimento.</div>'}</div>`;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { movArt = $("mArt").value; movTipo = b.dataset.t; vMov(); });
  $("mArt").onchange = e => movArt = e.target.value;
  $("mSave").onclick = () => run(async () => {
    const articoloId = $("mArt").value, q = Number($("mQty").value.replace(",", ".").trim()), nota = $("mNota").value.trim();
    if (!articoloId) throw new Error("Scegli l'articolo.");
    if (!isFinite(q) || q === 0 || (movTipo !== "RETTIFICA" && q < 0)) throw new Error("Quantità non valida.");
    if (movTipo === "RETTIFICA" && !nota) throw new Error("Scrivi il motivo nella nota.");
    S = await api("move", { tipo: movTipo, articoloId, quantita: q, nota });
    movArt = articoloId; toast("Registrato"); vMov();
  });
}

function movRows(list) {
  return list.map(m => {
    const d = new Date(m.data), when = isNaN(d) ? esc(m.data) : d.toLocaleString("it-IT", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
    return `<div class="row"><div><div class="t">${esc(m.articolo)}</div><div class="s">${when} · ${esc(m.tipo.toLowerCase())} · ${esc(m.utente)}${m.nota ? " · " + esc(m.nota) : ""}</div></div>
    <div class="qty ${m.variazione >= 0 ? "pos" : "neg"}">${m.variazione > 0 ? "+" : ""}${fmt(m.variazione)}</div></div>`;
  }).join("");
}

/* ---------- GIACENZE ---------- */
function vStock() {
  const list = active(), low = list.filter(a => a.soglia > 0 && a.giacenza <= a.soglia).length;
  $("main").innerHTML = `
  <input id="sQ" type="search" placeholder="Cerca articolo…" value="${esc(stockQ)}">
  ${low ? `<div class="hint low"><b>${low}</b> ${low === 1 ? "articolo è" : "articoli sono"} sotto la soglia minima.</div>` : ""}
  <div id="sList"></div>
  <button class="btn sec" id="sCsv">Scarica giacenze (Excel)</button>`;
  const draw = () => {
    const q = stockQ.toLowerCase(), g = byCat(list.filter(a => label(a).toLowerCase().includes(q)));
    $("sList").innerHTML = g.map(([c, as]) => `<h2>${esc(c)}</h2><div class="card">` + as.map(a => {
      const isLow = a.soglia > 0 && a.giacenza <= a.soglia;
      return `<div class="row" data-id="${esc(a.id)}"><div><div class="t">${esc(a.nome)}${isLow ? '<span class="badge">scorta bassa</span>' : ""}</div>${a.formato ? `<div class="s">${esc(a.formato)}</div>` : ""}</div>
      <div class="qty ${isLow ? "low" : ""}">${fmt(a.giacenza)} <small>${esc(a.unita)}</small></div></div>`;
    }).join("") + "</div>").join("") || '<div class="center">Nessun articolo trovato.</div>';
    document.querySelectorAll("#sList .row").forEach(r => r.onclick = () => { movArt = r.dataset.id; view = "mov"; render(); });
  };
  draw();
  $("sQ").oninput = e => { stockQ = e.target.value; draw(); };
  $("sCsv").onclick = () => csv("giacenze", [["Categoria", "Articolo", "Formato", "Giacenza", "Unità", "Soglia minima"]].concat(
    byCat(list).flatMap(g => g[1]).map(a => [a.categoria, a.nome, a.formato, a.giacenza, a.unita, a.soglia])));
}

/* ---------- REGISTRO ---------- */
function vLog() {
  const list = S.movements.filter(m => (!filt.art || m.articoloId === filt.art) && (!filt.tipo || m.tipo === filt.tipo));
  $("main").innerHTML = `
  <div class="two">
    <div><select id="fArt"><option value="">Tutti gli articoli</option>${artOptions(S.articles, filt.art)}</select></div>
    <div><select id="fTipo"><option value="">Tutti i tipi</option>${["CARICO", "SCARICO", "RETTIFICA"].map(t => `<option${t === filt.tipo ? " selected" : ""} value="${t}">${t[0] + t.slice(1).toLowerCase()}</option>`).join("")}</select></div>
  </div>
  <div class="card" style="margin-top:12px">${movRows(list) || '<div class="s">Nessun movimento.</div>'}</div>
  ${S.totalMovements > S.movements.length ? `<div class="hint">Mostrati gli ultimi ${S.movements.length} movimenti su ${S.totalMovements}. Lo scaricamento li contiene tutti.</div>` : ""}
  <button class="btn sec" id="lCsv">Scarica tutti i movimenti (Excel)</button>`;
  $("fArt").onchange = e => { filt.art = e.target.value; vLog(); };
  $("fTipo").onchange = e => { filt.tipo = e.target.value; vLog(); };
  $("lCsv").onclick = () => run(async () => {
    const all = await api("state", { limit: 100000 });
    csv("movimenti", [["Data e ora", "Tipo", "Articolo", "Quantità", "Variazione", "Nota", "Utente"]].concat(
      all.movements.map(m => [new Date(m.data).toLocaleString("it-IT"), m.tipo, m.articolo, m.quantita, m.variazione, m.nota, m.utente])));
  });
}

/* ---------- ARTICOLI ---------- */
function vArt() {
  const a = editId ? S.articles.find(x => x.id === editId) : null;
  if (editId !== null) {
    $("main").innerHTML = `
    <div class="card">
      <label for="aCat">Categoria</label>
      <select id="aCat">${["Birre", "Materiali"].map(c => `<option${a && a.categoria === c ? " selected" : ""}>${c}</option>`).join("")}</select>
      <label for="aNome">Nome</label><input id="aNome" maxlength="60" autocomplete="off" value="${esc(a ? a.nome : "")}" placeholder="es. IPA, Scatola da 12">
      <label for="aFor">Formato (facoltativo)</label><input id="aFor" maxlength="40" autocomplete="off" value="${esc(a ? a.formato : "")}" placeholder="es. 33 cl, fusto 20 L">
      <div class="two">
        <div><label for="aUni">Unità</label><input id="aUni" maxlength="15" autocomplete="off" value="${esc(a ? a.unita : "pz")}"></div>
        <div><label for="aSog">Soglia minima</label><input id="aSog" inputmode="decimal" autocomplete="off" value="${a ? a.soglia : 0}"></div>
      </div>
      <div class="hint">Sotto la soglia l'articolo viene segnalato come "scorta bassa". 0 = nessun avviso.</div>
      ${a ? `<label for="aAtt">Stato</label><select id="aAtt"><option value="1"${a.attivo ? " selected" : ""}>Attivo</option><option value="0"${a.attivo ? "" : " selected"}>Disattivato (nascosto, storico conservato)</option></select>` : ""}
      <button class="btn" id="aSave">Salva</button>
      <button class="btn sec" id="aBack">Annulla</button>
    </div>`;
    $("aBack").onclick = () => { editId = null; vArt(); };
    $("aSave").onclick = () => run(async () => {
      const article = { id: a ? a.id : "", categoria: $("aCat").value, nome: $("aNome").value.trim(), formato: $("aFor").value.trim(), unita: $("aUni").value.trim(),
        soglia: Number($("aSog").value.replace(",", ".")) || 0, attivo: a ? $("aAtt").value === "1" : true };
      if (!article.nome) throw new Error("Scrivi il nome.");
      S = await api("saveArticle", { article });
      editId = null; toast("Salvato"); vArt();
    });
    return;
  }
  $("main").innerHTML = `<button class="btn" id="aNew" style="margin-top:0">+ Nuovo articolo</button>` +
    (byCat(S.articles).map(([c, as]) => `<h2>${esc(c)}</h2><div class="card">` + as.map(x =>
      `<div class="row ${x.attivo ? "" : "off"}" data-id="${esc(x.id)}"><div><div class="t">${esc(x.nome)}</div><div class="s">${esc([x.formato, x.unita, x.attivo ? "" : "disattivato"].filter(Boolean).join(" · "))}</div></div><div class="s">Modifica ›</div></div>`
    ).join("") + "</div>").join("") || '<div class="center">Nessun articolo.</div>');
  $("aNew").onclick = () => { editId = ""; vArt(); };
  document.querySelectorAll("#main .row").forEach(r => r.onclick = () => { editId = r.dataset.id; vArt(); });
}

/* ---------- ESPORTAZIONE ---------- */
function csv(name, rows) {
  const cell = v => { let s = typeof v === "number" ? String(v).replace(".", ",") : String(v ?? ""); if (/^[=+\-@]/.test(s) && typeof v !== "number") s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const blob = new Blob(["﻿" + rows.map(r => r.map(cell).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = name + "_" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- AVVIO ---------- */
function getKey() {
  let k = keyFrom(location.hash);
  try { if (k) localStorage.setItem(KKEY, k); else k = localStorage.getItem(KKEY) || ""; } catch (e) {}
  return k;
}
$("btnAct").onclick = () => {
  const k = keyFrom($("actKey").value);
  if (!k) return toast("Codice non valido.", true);
  try { localStorage.setItem(KKEY, k); } catch (e) {}
  location.hash = "k=" + k;   // resta nel link: così l'icona sulla schermata Home lo conserva
  start();
};
async function start() {
  const k = getKey();
  if (!k) { $("activate").classList.remove("hide"); return; }
  $("activate").classList.add("hide");
  API_URL = "https://script.google.com/macros/s/" + k + "/exec";
  if (!token) return showLogin();
  try { S = await api("state"); showApp(); }
  catch (e) {
    if (!token) return;
    toast(e.message, true); $("login").classList.add("hide"); $("app").classList.remove("hide");
    $("main").innerHTML = '<div class="center">Impossibile caricare i dati.<br><br><button class="btn sec" onclick="location.reload()">Riprova</button></div>';
  }
}
start();
</script>
</body>
</html>
