<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f2a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario">
<title>Inventario</title>
<style>
  :root { --bg:#f4f2ee; --card:#fff; --ink:#1f2a2e; --mute:#6b7478; --line:#e2ded6; --acc:#b9770e; --in:#2e7d4f; --out:#b23b3b; --adj:#3a6ea5; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background:var(--ink); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; justify-content:space-between; align-items:center; }
  .top { position:sticky; top:0; z-index:5; }
  header h1 { font-size:18px; margin:0; }
  header button { background:none; border:1px solid #ffffff55; color:#fff; border-radius:8px; padding:6px 10px; font-size:13px; }
  main { padding:16px 16px calc(90px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; }
  nav { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav button { flex:1; background:none; border:0; padding:12px 4px; font-size:13px; color:var(--mute); font-weight:600; border-top:3px solid transparent; }
  nav button.on { color:var(--acc); border-top-color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-size:13px; color:var(--mute); margin:12px 0 4px; font-weight:600; }
  input, select, textarea { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  .btn { width:100%; border:0; border-radius:10px; padding:14px; font:inherit; font-weight:700; color:#fff; background:var(--acc); margin-top:16px; }
  .btn.sec { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; }
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; padding:12px 4px; border-radius:10px; border:1px solid var(--line); background:#fff; font:inherit; font-weight:700; color:var(--mute); }
  .seg button.on[data-t=CARICO] { background:var(--in); color:#fff; border-color:var(--in); }
  .seg button.on[data-t=SCARICO] { background:var(--out); color:#fff; border-color:var(--out); }
  .seg button.on[data-t=RETTIFICA] { background:var(--adj); color:#fff; border-color:var(--adj); }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--mute); margin:18px 0 8px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .row .t { font-weight:600; }
  .row .s { font-size:13px; color:var(--mute); }
  .qty { font-weight:700; font-size:18px; white-space:nowrap; text-align:right; }
  .qty small { font-size:12px; color:var(--mute); font-weight:500; }
  .low { color:var(--out); }
  .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:20px; background:#f7e3e3; color:var(--out); margin-left:6px; }
  .off { opacity:.5; }
  .pos { color:var(--in); } .neg { color:var(--out); }
  .hint { font-size:13px; color:var(--mute); margin-top:6px; }
  #toast { position:fixed; left:16px; right:16px; bottom:calc(80px + env(safe-area-inset-bottom)); background:var(--ink); color:#fff; padding:12px 14px; border-radius:10px; text-align:center; display:none; z-index:9; }
  #toast.err { background:var(--out); }
  .center { text-align:center; padding:40px 0; color:var(--mute); }
  #login { max-width:340px; margin:12vh auto 0; padding:0 20px; }
  #login h1 { text-align:center; }
  #pin { text-align:center; font-size:26px; letter-spacing:.3em; }
  .hide { display:none !important; }
  .two { display:flex; gap:10px; } .two > div { flex:1; }
  .tabs button { font-size:14px; position:relative; }
  .tabs button small { font-weight:500; opacity:.7; }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .tabs .dot { position:absolute; top:6px; right:8px; width:8px; height:8px; border-radius:50%; background:var(--out); }
  .btn.in { background:var(--in); } .btn.out { background:var(--out); } .btn.adj { background:var(--adj); }
  .seg button.on[data-t=SCARICO] { background:var(--out); color:#fff; border-color:var(--out); }
  .newbox { border-left:3px solid var(--in); padding-left:10px; margin-top:4px; }
  #sync { font-size:13px; padding:8px 16px; background:#e9e6df; color:var(--mute); display:flex; justify-content:space-between; align-items:center; gap:10px; }
  #sync.wait { background:#fbecd3; color:#7a4e06; }
  #sync.bad { background:#f7e3e3; color:var(--out); }
  #sync button { background:#fff; border:1px solid currentColor; color:inherit; border-radius:8px; padding:4px 10px; font:inherit; font-weight:700; white-space:nowrap; }
  .badge.wait { background:#fbecd3; color:#7a4e06; }
</style>
</head>
<body>

<div id="activate" class="hide" style="max-width:340px;margin:12vh auto 0;padding:0 20px">
  <h1 style="text-align:center">Inventario</h1>
  <div class="card">
    <label for="actKey">Codice o link di attivazione</label>
    <input id="actKey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="hint">Incolla il link che hai ricevuto. Serve una volta sola.</div>
    <button class="btn" id="btnAct">Attiva</button>
  </div>
</div>

<div id="login" class="hide">
  <h1>Inventario</h1>
  <div class="card">
    <label for="pin">PIN personale</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <button class="btn" id="btnLogin">Entra</button>
  </div>
</div>

<div id="app" class="hide">
  <div class="top"><header><h1>Inventario</h1><div><span id="who" style="font-size:13px;margin-right:8px"></span><button id="btnOut">Esci</button></div></header>
  <div id="sync"></div></div>
  <main id="main"></main>
  <nav>
    <button data-v="in">Entrate</button>
    <button data-v="out">Uscite</button>
    <button data-v="stock">Giacenze</button>
    <button data-v="log">Registro</button>
  </nav>
</div>
<div id="toast"></div>

<script>
"use strict";
/* Questa pagina non contiene l'indirizzo dello script: arriva dal link di attivazione e resta solo sul telefono. */
let API_URL = "";
const KKEY = "inv_key";
const keyFrom = s => { const m = String(s || "").trim().match(/(?:\/s\/|[#&]k=|^)([A-Za-z0-9_-]{25,200})(?:\/exec)?$/); return m ? m[1] : ""; };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = n => Number(n).toLocaleString("it-IT", { maximumFractionDigits: 2 });
const TKEY = "inv_token";
let S = { user:"", articles:[], movements:[], totalMovements:0 };
let view = "in", movTipo = "CARICO", movArt = "", editId = null, busy = false;
let filt = { art:"", tipo:"" }, stockQ = "";

const store = {
  get() { try { return localStorage.getItem(TKEY) || ""; } catch (e) { return ""; } },
  set(v) { try { v ? localStorage.setItem(TKEY, v) : localStorage.removeItem(TKEY); } catch (e) {} }
};
let token = store.get();

/* ---------- LAVORO SENZA RETE ----------
   base  = ultimo stato ricevuto dallo script (salvato sul telefono)
   queue = movimenti fatti sul telefono e non ancora confermati dallo script
   S     = base + queue: è quello che si vede nell'app */
const BKEY = "inv_base", QKEY = "inv_queue", RKEY = "inv_rejected";
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let base = ls.get(BKEY, null), queue = ls.get(QKEY, []), rejected = ls.get(RKEY, []), flushing = false, lastRefresh = 0;
const saveQ = () => ls.set(QKEY, queue);
const uid = () => { try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  const b = new Uint8Array(16); crypto.getRandomValues(b); return [...b].map(x => x.toString(16).padStart(2, "0")).join(""); };
const r3 = n => Math.round(n * 1000) / 1000;

function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = err ? "err" : ""; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", err ? 4500 : 2200);
}

async function api(action, data) {
  let res;
  try {
    const r = await fetch(API_URL, {
      method: "POST", redirect: "follow", referrerPolicy: "no-referrer",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ action, token }, data || {}))
    });
    res = await r.json();
  } catch (e) { throw Object.assign(new Error("Connessione assente o servizio non raggiungibile."), { net: true }); }
  if (!res.ok) {
    if (res.code === "AUTH") { token = ""; store.set(""); showLogin(); }
    throw Object.assign(new Error(res.error || "Errore"), { auth: res.code === "AUTH" });
  }
  return res;
}

function setBase(st) {
  const keep = { user: S.user };
  base = st; base.savedAt = Date.now(); if (!base.user) base.user = keep.user;
  ls.set(BKEY, base); derive();
}
function derive() {
  S = JSON.parse(JSON.stringify(base || S));
  queue.forEach(it => applyLocal(S, it));
  syncBar();
}
function applyLocal(st, it) {
  if (it.kind === "article") {
    const a = st.articles.find(x => x.id === it.article.id);
    if (a) Object.assign(a, it.article);
    else st.articles.push(Object.assign({ giacenza: 0, lotti: [], soglia: 0, attivo: true }, it.article));
    return;
  }
  const a = st.articles.find(x => x.id === it.articoloId); if (!a) return;
  const v = it.tipo === "CARICO" ? it.quantita : it.tipo === "SCARICO" ? -it.quantita : it.quantita;
  a.giacenza = r3(a.giacenza + v);
  if (it.lotto) {
    const arr = lotsOf(a).map(x => [x[0], x[1]]), l = arr.find(x => x[0] === it.lotto);
    if (l) l[1] = r3(l[1] + v); else arr.push([it.lotto, v]);
    a.lotti = arr.filter(x => x[1] !== 0);
  }
  st.movements.unshift({ data: it.quando, tipo: it.tipo, articoloId: a.id, articolo: label(a), quantita: Math.abs(it.quantita), variazione: v,
    nota: it.nota, utente: st.user, lotto: it.lotto, pending: true });
  st.totalMovements = (st.totalMovements || 0) + 1;
}

/* Controllo sul telefono: anche senza rete non si scarica più di quanto risulta. */
function checkStock(m) {
  const a = S.articles.find(x => x.id === m.articoloId); if (!a) throw new Error("Articolo non trovato.");
  const v = m.tipo === "CARICO" ? m.quantita : m.tipo === "SCARICO" ? -m.quantita : m.quantita;
  if (v >= 0) return;
  if (m.lotto) { const l = lotsOf(a).find(x => x[0] === m.lotto), have = l ? l[1] : 0;
    if (have + v < -1e-9) throw new Error(`Nel lotto ${m.lotto} risultano solo ${fmt(have)} ${a.unita}.`); }
  if (a.giacenza + v < -1e-9) throw new Error(`Risultano solo ${fmt(a.giacenza)} ${a.unita}.`);
}

/* Registra un movimento: se c'è rete va subito allo script, altrimenti resta in coda sul telefono. */
async function submitMove(m) {
  checkStock(m);
  const it = Object.assign({ kind: "move", uid: uid(), quando: new Date().toISOString() }, m);
  if (!queue.length && navigator.onLine !== false) {
    try { setBase(await api("move", moveBody(it))); return true; }
    catch (e) { if (!e.net) throw e; }
  }
  it.offline = true; queue.push(it); saveQ(); derive();
  return false;
}
const moveBody = it => ({ tipo: it.tipo, articoloId: it.articoloId, quantita: it.quantita, nota: it.nota, lotto: it.lotto, uid: it.uid, quando: it.quando, offline: !!it.offline });

/* Crea o riattiva un articolo. Senza rete l'articolo nuovo riceve un codice provvisorio. Restituisce l'id. */
async function submitArticle(article) {
  if (!queue.length && navigator.onLine !== false) {
    try {
      const before = new Set(S.articles.map(x => x.id)), st = await api("saveArticle", { article });
      setBase(st);
      return article.id || (S.articles.find(x => !before.has(x.id)) || {}).id;
    } catch (e) { if (!e.net) throw e; }
  }
  const art = Object.assign({}, article);
  if (!art.id) art.id = "tmp-" + uid().slice(0, 12);
  queue.push({ kind: "article", uid: uid(), article: art }); saveQ(); derive();
  return art.id;
}
const queued = ok => ok ? "" : " · partirà appena c'è rete";

/* Invia la coda, un movimento alla volta e nell'ordine in cui sono stati fatti. */
async function flush() {
  if (flushing || !queue.length || !token || !API_URL) return;
  flushing = true; syncBar();
  try {
    while (queue.length) {
      const it = queue[0]; let st = null;
      try {
        if (it.kind === "article") {
          const tmp = it.article.id.startsWith("tmp-"), body = Object.assign({}, it.article, { id: tmp ? "" : it.article.id });
          const before = new Set(base.articles.map(x => x.id)); let realId = it.article.id;
          try { st = await api("saveArticle", { article: body }); if (tmp) realId = (st.articles.find(x => !before.has(x.id)) || {}).id; }
          catch (e) {
            if (e.net || e.auth || !tmp) throw e;
            const ex = base.articles.find(x => artKey(x.nome, x.formato) === artKey(it.article.nome, it.article.formato));
            if (!ex) throw e; realId = ex.id;   // era già stato creato: si usa quello
          }
          if (tmp && realId) {
            queue.forEach(q => { if (q.articoloId === it.article.id) q.articoloId = realId; });
            if (inArt === it.article.id) inArt = realId; if (outArt === it.article.id) outArt = realId; if (editId === it.article.id) editId = realId;
          }
        } else {
          st = await api("move", moveBody(it));
        }
      } catch (e) {
        if (e.net || e.auth) throw e;
        const a = (S.articles.find(x => x.id === (it.articoloId || (it.article || {}).id)) || it.article || {});
        rejected.push({ quando: it.quando || new Date().toISOString(), tipo: it.kind === "article" ? "ARTICOLO" : it.tipo, articolo: a.nome ? label(a) : "",
          quantita: it.quantita, lotto: it.lotto || "", nota: it.nota || "", errore: e.message });
        ls.set(RKEY, rejected);
      }
      queue.shift(); saveQ();
      if (st) setBase(st); else derive();
    }
  } catch (e) { /* senza rete o sessione scaduta: la coda resta sul telefono */ }
  flushing = false; syncBar();
  if (!queue.length && (view === "stock" || view === "log" || view === "rej")) render();
}

async function refresh(force) {
  if (!token || !API_URL || (!force && Date.now() - lastRefresh < 60000)) return;
  lastRefresh = Date.now();
  try { await flush(); if (!queue.length) { setBase(await api("state")); if (view === "stock" || view === "log") render(); } } catch (e) {}
  syncBar();
}

function syncBar() {
  const b = $("sync"); if (!b) return;
  const at = base && base.savedAt ? new Date(base.savedAt) : null;
  const when = !at ? "mai" : at.toDateString() === new Date().toDateString()
    ? "alle " + at.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" })
    : "il " + at.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const n = queue.filter(q => q.kind === "move").length || queue.length;
  if (rejected.length) {
    b.className = "bad"; b.innerHTML = `<span><b>${rejected.length}</b> ${rejected.length === 1 ? "movimento non accettato" : "movimenti non accettati"}</span><button id="syncRej">Vedi</button>`;
    $("syncRej").onclick = () => { view = "rej"; render(); };
  } else if (queue.length) {
    b.className = "wait"; b.innerHTML = `<span>${flushing ? "Invio in corso…" : navigator.onLine === false ? "Senza rete" : "Non inviati"} · <b>${n}</b> ${n === 1 ? "movimento in attesa" : "movimenti in attesa"}</span>${flushing ? "" : `<button id="syncNow">Invia ora</button>`}`;
    if ($("syncNow")) $("syncNow").onclick = () => { flush(); };
  } else {
    b.className = ""; b.innerHTML = `<span>Giacenze aggiornate ${esc(when)}</span><button id="syncNow">Aggiorna</button>`;
    $("syncNow").onclick = () => refresh(true);
  }
}


function showLogin() { $("app").classList.add("hide"); $("login").classList.remove("hide"); $("pin").value = ""; $("pin").focus(); }
function showApp() { $("login").classList.add("hide"); $("app").classList.remove("hide"); $("who").textContent = S.user; syncBar(); render(); }

async function run(fn) {
  if (busy) return; busy = true;
  document.querySelectorAll("button.btn").forEach(b => b.disabled = true);
  try { await fn(); } catch (e) { toast(e.message, true); }
  busy = false;
  document.querySelectorAll("button.btn").forEach(b => b.disabled = false);
}

$("btnLogin").onclick = () => run(async () => {
  const pin = $("pin").value.trim();
  if (!/^\d{4,12}$/.test(pin)) throw new Error("Inserisci il PIN.");
  const r = await api("login", { pin });
  token = r.token; store.set(token);
  setBase(await api("state")); lastRefresh = Date.now();
  showApp(); flush();
});
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") $("btnLogin").click(); });
$("btnOut").onclick = async () => {
  if (queue.length) return toast("Ci sono movimenti non ancora inviati: esci quando c'è rete e sono partiti.", true);
  try { await api("logout"); } catch (e) {}
  token = ""; store.set(""); base = null; ls.set(BKEY, null); rejected = []; ls.set(RKEY, null); showLogin();
};
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { view = b.dataset.v; editId = null; render(); });

const UNITS = ["bt", "fusti", "scatole", "pz", "kg", "L"];
const UNIT_LABEL = { bt:"Bottiglie / lattine (bt)", fusti:"Fusti", scatole:"Scatole / cartoni", pz:"Pezzi (pz)", kg:"Chili (kg)", L:"Litri (L)" };
const norm = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const artKey = (nome, formato) => norm(nome) + "|" + norm(formato).replace(/^(bottiglia|bott|bt)/, "");
const BEER_FORMATS = ["Bottiglia 33 cl", "Bottiglia 50 cl", "Bottiglia 75 cl", "Lattina 33 cl", "Lattina 44 cl", "Fusto 20 L", "Fusto 24 L", "Fusto 30 L"];
const tidy = t => { t = String(t || "").replace(/\s+/g, " ").trim(); return t ? t[0].toUpperCase() + t.slice(1) : ""; };
const label = a => a.nome + (a.formato ? " - " + a.formato : "");
const active = () => S.articles.filter(a => a.attivo);
const GROUPS = ["Materiali", "Bottiglie", "Fusti"];
const groupOf = a => a.categoria !== "Birre" ? "Materiali" : (/^fust/i.test(a.formato || "") || a.unita === "fusti") ? "Fusti" : "Bottiglie";
const isLowA = a => a.giacenza < 0 || (a.soglia > 0 && a.giacenza <= a.soglia);
const sortL = l => l.slice().sort((x, y) => label(x).localeCompare(label(y), "it"));
const byCat = list => GROUPS.map(g => [g, sortL(list.filter(a => groupOf(a) === g))]).filter(g => g[1].length);
const artOptions = (list, sel, withStock) => byCat(list).map(([c, as]) =>
  `<optgroup label="${esc(c)}">` + as.map(a => `<option value="${esc(a.id)}"${a.id === sel ? " selected" : ""}>${esc(label(a))}${withStock ? " (" + fmt(a.giacenza) + " " + esc(a.unita) + ")" : ""}</option>`).join("") + "</optgroup>").join("");
const groupTabs = (cur, extra) => `<div class="seg tabs">${GROUPS.map(g => `<button data-g="${g}" class="${g === cur ? "on" : ""}">${g}${extra ? extra(g) : ""}</button>`).join("")}</div>`;
const num = v => Number(String(v || "").replace(",", ".").trim());
const FORMATS_OF = { Bottiglie: BEER_FORMATS.filter(f => !/^fusto/i.test(f)), Fusti: BEER_FORMATS.filter(f => /^fusto/i.test(f)) };
const lotsOn = () => !!S.lotti;   // i lotti si attivano quando lo script li supporta
const hasLot = a => !!a && a.categoria === "Birre" && lotsOn();
const normLot = t => String(t || "").toUpperCase().replace(/\s+/g, "");
const lotsOf = a => { const l = a && a.lotti; return Array.isArray(l) ? l : Object.entries(l || {}); };
const lotsTxt = a => lotsOf(a).map(([l, q]) => l + ": " + fmt(q)).join("; ");
const lotList = a => `<datalist id="lotsOf${esc(a.id)}">${lotsOf(a).map(([l]) => `<option value="${esc(l)}">`).join("")}</datalist>`;
let inGroup = "Bottiglie", inArt = "", outTipo = "SCARICO", outLot = "", outArt = "", outGroup = "Bottiglie", stockTab = "Materiali", backView = "stock";

function render() {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  ({ in: vIn, out: vOut, stock: vStock, log: vLog, art: vArt, rej: vRej })[view]();
  window.scrollTo(0, 0);
}

/* ---------- ENTRATE ---------- */
function vIn() {
  const list = sortL(active().filter(a => groupOf(a) === inGroup));
  const isNew = inArt === "__new" || !list.length;
  const names = [...new Set(S.articles.filter(a => groupOf(a) === inGroup).map(a => a.nome))].sort((x, y) => x.localeCompare(y, "it"));
  $("main").innerHTML = `
  <div class="card">
    ${groupTabs(inGroup)}
    <label for="iArt">Articolo</label>
    <select id="iArt">${list.length ? `<option value="">Scegli…</option>` : ""}${list.map(a => `<option value="${esc(a.id)}"${a.id === inArt ? " selected" : ""}>${esc(label(a))} (${fmt(a.giacenza)} ${esc(a.unita)})</option>`).join("")}<option value="__new"${isNew ? " selected" : ""}>+ Nuovo articolo…</option></select>
    ${isNew ? `<div class="newbox">
      <label for="iNome">Nome</label>
      <input id="iNome" list="iNomi" maxlength="60" autocomplete="off" placeholder="${inGroup === "Materiali" ? "es. Scatola 12x33 cl, Tappi corona" : "es. Alpa"}">
      <datalist id="iNomi">${names.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
      ${inGroup === "Materiali" ? `
      <label for="iUni">Si conta in</label>
      <select id="iUni">${["pz", "scatole", "kg", "L"].map(u => `<option value="${u}">${UNIT_LABEL[u]}</option>`).join("")}</select>` : `
      <label for="iFor">Formato</label>
      <select id="iFor"><option value="">Scegli…</option>${FORMATS_OF[inGroup].map(f => `<option>${esc(f)}</option>`).join("")}</select>`}
      <div class="hint">Se l'articolo esiste già, la quantità viene aggiunta a quello: non si creano doppioni.</div>
    </div>` : ""}
    ${inGroup !== "Materiali" && lotsOn() ? (() => { const cur = list.find(a => a.id === inArt); return `
    <label for="iLot">Lotto</label>
    <input id="iLot" ${cur ? `list="lotsOf${esc(cur.id)}"` : ""} maxlength="20" autocomplete="off" autocapitalize="characters" placeholder="es. L2611">
    ${cur ? lotList(cur) + (lotsOf(cur).length ? `<div class="hint">Lotti già in magazzino: ${esc(lotsTxt(cur))}</div>` : "") : ""}`; })() : ""}
    <label for="iQty">Quantità in entrata</label>
    <input id="iQty" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
    <label for="iNota">Nota (facoltativa)</label>
    <input id="iNota" type="text" maxlength="200" autocomplete="off" placeholder="es. fornitore, cotta">
    <button class="btn in" id="iSave">Registra entrata</button>
  </div>
  <h2>Ultime entrate</h2><div class="card">${movRows(S.movements.filter(m => m.tipo === "CARICO").slice(0, 5)) || '<div class="s">Ancora nessuna entrata.</div>'}</div>`;
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { inGroup = b.dataset.g; inArt = ""; vIn(); });
  $("iArt").onchange = e => { inArt = e.target.value; vIn(); };
  $("iSave").onclick = () => run(async () => {
    const q = num($("iQty").value), nota = $("iNota").value.trim(), lotto = $("iLot") ? normLot($("iLot").value) : "";
    let id = isNew ? "" : $("iArt").value, msg = "Entrata registrata";
    if ($("iLot") && !lotto) throw new Error("Scrivi il lotto.");
    if (!isNew && !id) throw new Error("Scegli l'articolo.");
    if (isNew) {
      const nome = tidy($("iNome").value), formato = inGroup === "Materiali" ? "" : $("iFor").value;
      if (!nome) throw new Error("Scrivi il nome.");
      if (inGroup !== "Materiali" && !formato) throw new Error("Scegli il formato.");
      if (!isFinite(q) || q <= 0) throw new Error("Quantità non valida.");
      const ex = S.articles.find(x => artKey(x.nome, x.formato) === artKey(nome, formato));
      if (ex) {
        id = ex.id; msg = "Già presente: aggiunto a " + label(ex);
        if (!ex.attivo) await submitArticle({ id: ex.id, categoria: ex.categoria, nome: ex.nome, formato: ex.formato, unita: ex.unita, soglia: ex.soglia, attivo: true });
      } else {
        id = await submitArticle({ id: "", categoria: inGroup === "Materiali" ? "Materiali" : "Birre", nome, formato,
          unita: inGroup === "Materiali" ? $("iUni").value : inGroup === "Fusti" ? "fusti" : "bt", soglia: 0, attivo: true });
        msg = "Nuovo articolo creato";
      }
    }
    if (!isFinite(q) || q <= 0) throw new Error("Quantità non valida.");
    const ok = await submitMove({ tipo: "CARICO", articoloId: id, quantita: q, nota, lotto });
    inArt = id; toast((ok ? msg : "Entrata salvata sul telefono") + (lotto ? " · lotto " + lotto : "") + queued(ok)); vIn();
  });
}

/* ---------- USCITE ---------- */
function vOut() {
  const list = sortL(active().filter(a => groupOf(a) === outGroup));
  const sel = list.find(a => a.id === outArt);
  $("main").innerHTML = `
  <div class="card">
    ${groupTabs(outGroup)}
    <div class="seg kind" style="margin-top:10px">${[["SCARICO", "Uscita"], ["RETTIFICA", "Correzione"]].map(([t, l]) => `<button data-t="${t}" class="${t === outTipo ? "on" : ""}">${l}</button>`).join("")}</div>
    <label for="oArt">Articolo</label>
    <select id="oArt">${list.length ? `<option value="">Scegli…</option>` + list.map(a => `<option value="${esc(a.id)}"${a.id === outArt ? " selected" : ""}>${esc(label(a))} (${fmt(a.giacenza)} ${esc(a.unita)})</option>`).join("") : `<option value="">Nessun articolo in ${esc(outGroup.toLowerCase())}</option>`}</select>
    ${sel && hasLot(sel) ? (() => { const ls = lotsOf(sel); return `
    <label for="oLot">Lotto</label>
    ${ls.length ? `<select id="oLot">${ls.map(([l, q], i) => `<option value="${esc(l)}"${l === outLot || (!outLot && i === 0) ? " selected" : ""}>${esc(l)} — ${fmt(q)} ${esc(sel.unita)}${i === 0 ? " (più vecchio)" : ""}</option>`).join("")}</select>`
      : `<div class="hint">Nessun lotto in magazzino.</div>`}
    ${outTipo === "RETTIFICA" ? `<input id="oLotNew" maxlength="20" autocomplete="off" autocapitalize="characters" placeholder="oppure scrivi un altro lotto" style="margin-top:6px">` : ""}`; })()
      : sel ? `<div class="hint">Disponibili: <b>${fmt(sel.giacenza)} ${esc(sel.unita)}</b></div>` : ""}
    <label for="oQty">Quantità</label>
    <input id="oQty" type="text" inputmode="${outTipo === "RETTIFICA" ? "text" : "decimal"}" autocomplete="off" placeholder="${outTipo === "RETTIFICA" ? "es. -3 oppure 5" : "0"}">
    ${outTipo === "RETTIFICA" ? `<div class="hint">Per rotture, errori o conteggi: negativo toglie, positivo aggiunge.</div>` : ""}
    <label for="oNota">Nota ${outTipo === "RETTIFICA" ? "(obbligatoria)" : "(facoltativa)"}</label>
    <input id="oNota" type="text" maxlength="200" autocomplete="off" placeholder="${outTipo === "RETTIFICA" ? "es. 2 bottiglie rotte" : "es. cliente, ordine"}">
    <button class="btn ${outTipo === "SCARICO" ? "out" : "adj"}" id="oSave">${outTipo === "SCARICO" ? "Registra uscita" : "Registra correzione"}</button>
  </div>
  <h2>Ultime uscite e correzioni</h2><div class="card">${movRows(S.movements.filter(m => m.tipo !== "CARICO").slice(0, 5)) || '<div class="s">Ancora nessuna uscita.</div>'}</div>`;
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { outGroup = b.dataset.g; outArt = ""; outLot = ""; vOut(); });
  document.querySelectorAll(".kind button").forEach(b => b.onclick = () => { outArt = $("oArt").value; outTipo = b.dataset.t; vOut(); });
  $("oArt").onchange = e => { outArt = e.target.value; outLot = ""; vOut(); };
  if ($("oLot")) $("oLot").onchange = e => outLot = e.target.value;
  $("oSave").onclick = () => run(async () => {
    const id = $("oArt").value, q = num($("oQty").value), nota = $("oNota").value.trim();
    if (!id) throw new Error("Scegli l'articolo.");
    if (!isFinite(q) || q === 0 || (outTipo === "SCARICO" && q < 0)) throw new Error("Quantità non valida.");
    if (outTipo === "RETTIFICA" && !nota) throw new Error("Scrivi il motivo nella nota.");
    const lotto = normLot(($("oLotNew") && $("oLotNew").value) || ($("oLot") && $("oLot").value) || "");
    if (hasLot(sel) && !lotto) throw new Error("Scegli il lotto.");
    const ok = await submitMove({ tipo: outTipo, articoloId: id, quantita: q, nota, lotto });
    outArt = id; toast((outTipo === "SCARICO" ? "Uscita " : "Correzione ") + (ok ? "registrata" : "salvata sul telefono") + (lotto ? " · lotto " + lotto : "") + queued(ok)); vOut();
  });
}

function movRows(list) {
  return list.map(m => {
    const d = new Date(m.data), when = isNaN(d) ? esc(m.data) : d.toLocaleString("it-IT", { day:"2-digit", month:"2-digit", year:"2-digit", hour:"2-digit", minute:"2-digit" });
    const tl = { CARICO:"entrata", SCARICO:"uscita", RETTIFICA:"correzione" }[m.tipo] || m.tipo.toLowerCase();
    return `<div class="row"><div><div class="t">${esc(m.articolo)}${m.pending ? '<span class="badge wait">da inviare</span>' : ""}</div><div class="s">${when} · ${esc(tl)} · ${esc(m.utente)}${m.lotto ? " · lotto " + esc(m.lotto) : ""}${m.nota ? " · " + esc(m.nota) : ""}</div></div>
    <div class="qty ${m.variazione >= 0 ? "pos" : "neg"}">${m.variazione > 0 ? "+" : ""}${fmt(m.variazione)}</div></div>`;
  }).join("");
}

/* ---------- GIACENZE ---------- */
function vStock() {
  const list = active(), off = S.articles.filter(a => !a.attivo && groupOf(a) === stockTab);
  const tabLow = g => list.some(a => groupOf(a) === g && isLowA(a));
  $("main").innerHTML = `
  ${groupTabs(stockTab, g => ` <small>${list.filter(a => groupOf(a) === g).length}</small>${tabLow(g) ? `<span class="dot"></span>` : ""}`)}
  <input id="sQ" type="search" placeholder="Cerca in ${esc(stockTab.toLowerCase())}…" value="${esc(stockQ)}" style="margin-top:12px">
  <div id="sList"></div>
  ${off.length ? `<details class="hint" style="margin-top:12px"><summary>Articoli disattivati (${off.length})</summary><div class="card" style="margin-top:8px">${sortL(off).map(a => `<div class="row off" data-id="${esc(a.id)}"><div class="t">${esc(label(a))}</div><div class="s">Apri ›</div></div>`).join("")}</div></details>` : ""}
  <div class="hint">Tocca un articolo per modificarlo, impostare l'avviso di scorta bassa o unire un doppione.</div>
  <button class="btn sec" id="sCsv">Scarica giacenze (Excel)</button>`;
  const draw = () => {
    const q = stockQ.toLowerCase();
    const as = sortL(list.filter(a => groupOf(a) === stockTab && label(a).toLowerCase().includes(q)));
    const low = as.filter(isLowA).length;
    $("sList").innerHTML = (low ? `<div class="hint low"><b>${low}</b> ${low === 1 ? "articolo è" : "articoli sono"} sotto la soglia minima o da controllare.</div>` : "") +
      (as.length ? `<div class="card" style="margin-top:12px">` + as.map(a => `<div class="row" data-id="${esc(a.id)}"><div><div class="t">${esc(a.nome)}${a.giacenza < 0 ? '<span class="badge">negativa: da controllare</span>' : isLowA(a) ? '<span class="badge">scorta bassa</span>' : ""}</div>${a.formato ? `<div class="s">${esc(a.formato)}${hasLot(a) && lotsOf(a).length ? " · " + (lotsOf(a).length === 1 ? "lotto " + esc(lotsOf(a)[0][0]) : lotsOf(a).length + " lotti") : ""}</div>` : ""}</div>
      <div class="qty ${isLowA(a) ? "low" : ""}">${fmt(a.giacenza)} <small>${esc(a.unita)}</small></div></div>`).join("") + "</div>"
      : `<div class="center">${q ? "Nessun articolo trovato." : "Nessun articolo in questa sezione."}</div>`);
    bindRows();
  };
  const bindRows = () => document.querySelectorAll("#main .row").forEach(r => r.onclick = () => { editId = r.dataset.id; view = "art"; render(); });
  draw();
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { stockTab = b.dataset.g; stockQ = ""; vStock(); });
  $("sQ").oninput = e => { stockQ = e.target.value; draw(); };
  $("sCsv").onclick = () => csv("giacenze", [["Sezione", "Articolo", "Formato", "Giacenza", "Unità", "Soglia minima", "Lotti"]].concat(
    GROUPS.flatMap(g => sortL(list.filter(a => groupOf(a) === g)).map(a => [g, a.nome, a.formato, a.giacenza, a.unita, a.soglia, lotsTxt(a)]))));
}

/* ---------- REGISTRO ---------- */

  $("main").innerHTML = `
  <div class="two">
    <div><select id="fArt"><option value="">Tutti gli articoli</option>${artOptions(S.articles, filt.art)}</select></div>
    <div><select id="fTipo"><option value="">Tutti i tipi</option>${[["CARICO", "Entrate"], ["SCARICO", "Uscite"], ["RETTIFICA", "Correzioni"]].map(([t, l]) => `<option${t === filt.tipo ? " selected" : ""} value="${t}">${l}</option>`).join("")}</select></div>
  </div>
  <div class="card" style="margin-top:12px">${movRows(list) || '<div class="s">Nessun movimento.</div>'}</div>
  ${S.totalMovements > S.movements.length ? `<div class="hint">Mostrati gli ultimi ${S.movements.length} movimenti su ${S.totalMovements}. Lo scaricamento li contiene tutti.</div>` : ""}
  <button class="btn sec" id="lCsv">Scarica tutti i movimenti (Excel)</button>`;

  $("fTipo").onchange = e => { filt.tipo = e.target.value; vLog(); };

    const all = await api("state", { limit: 100000 });

      all.movements.map(m => [new Date(m.data).toLocaleString("it-IT"), m.tipo, m.articolo, m.lotto || "", m.quantita, m.variazione, m.nota, m.utente])));
  });
}

/* ---------- SCHEDA ARTICOLO (da Giacenze) ---------- */
function vArt() {
  const a = S.articles.find(x => x.id === editId);
  if (!a) { view = "stock"; return render(); }
  const g = groupOf(a), forms = g === "Materiali" ? null : FORMATS_OF[g].concat(FORMATS_OF[g].includes(a.formato) || !a.formato ? [] : [a.formato]);
  const goBack = () => { editId = null; view = "stock"; render(); };
  $("main").innerHTML = `
  <button class="btn sec" id="aBack" style="margin-top:0">‹ Torna a Giacenze</button>
  <div class="card" style="margin-top:12px">
    <div class="t" style="font-size:18px">${esc(label(a))}</div>
    <div class="s">${g} · giacenza <b>${fmt(a.giacenza)} ${esc(a.unita)}</b></div>
    ${hasLot(a) ? `<div style="margin-top:10px">${lotsOf(a).length ? lotsOf(a).map(([l, q], i) => `<div class="row"><div class="t">Lotto ${esc(l)}${i === 0 && lotsOf(a).length > 1 ? ' <span class="s">più vecchio</span>' : ""}</div><div class="qty">${fmt(q)} <small>${esc(a.unita)}</small></div></div>`).join("") : '<div class="s">Nessun lotto in magazzino.</div>'}</div>` : ""}
    ${a.attivo && hasLot(a) ? `<label for="aLot">Lotto</label><input id="aLot" list="lotsOf${esc(a.id)}" maxlength="20" autocomplete="off" autocapitalize="characters" value="${esc(lotsOf(a).length ? lotsOf(a)[0][0] : "")}" placeholder="es. L2611">${lotList(a)}` : ""}
    ${a.attivo ? `<label for="aQty">Quantità</label>
    <input id="aQty" type="text" inputmode="decimal" autocomplete="off" placeholder="0">
    <label for="aNota">Nota (facoltativa)</label>
    <input id="aNota" type="text" maxlength="200" autocomplete="off" placeholder="es. cliente, ordine">
    <div class="two" style="margin-top:12px">
      <div><button class="btn in" id="aIn" style="margin-top:0">+ Registra entrata</button></div>
      <div><button class="btn out" id="aOut" style="margin-top:0">− Registra uscita</button></div>
    </div>` : `<div class="hint">Articolo disattivato: riattivalo qui sotto per registrare entrate o uscite.</div>`}
  </div>
  <h2>Modifica</h2>
  <div class="card">
    <label for="aNome" style="margin-top:0">Nome</label><input id="aNome" maxlength="60" autocomplete="off" value="${esc(a.nome)}">
    ${forms ? `<label for="aFor">Formato</label><select id="aFor">${forms.map(f => `<option${a.formato === f ? " selected" : ""}>${esc(f)}</option>`).join("")}</select>`
      : `<label for="aUni">Si conta in</label><select id="aUni">${["pz", "scatole", "kg", "L"].concat(["pz", "scatole", "kg", "L"].includes(a.unita) ? [] : [a.unita]).map(u => `<option value="${esc(u)}"${a.unita === u ? " selected" : ""}>${esc(UNIT_LABEL[u] || u)}</option>`).join("")}</select>`}
    <label for="aSog">Avvisami quando scende sotto</label>
    <input id="aSog" inputmode="decimal" autocomplete="off" placeholder="nessun avviso" value="${a.soglia ? a.soglia : ""}">
    <label for="aAtt">Stato</label><select id="aAtt"><option value="1"${a.attivo ? " selected" : ""}>Attivo</option><option value="0"${a.attivo ? "" : " selected"}>Disattivato (nascosto, storico conservato)</option></select>
    <div class="hint">La giacenza qui non si modifica: si cambia solo con entrate, uscite o correzioni, così il Registro resta corretto.</div>
    <button class="btn" id="aSave">Salva modifiche</button>
  </div>
  ${a.attivo ? `<h2>Doppione?</h2><div class="card">
    <label for="aMerge" style="margin-top:0">Unisci con…</label>
    <select id="aMerge"><option value="">Scegli l'articolo giusto…</option>${artOptions(S.articles.filter(x => x.attivo && x.id !== a.id && x.unita === a.unita), "", true)}</select>
    <div class="hint">La giacenza di questo articolo viene spostata su quello scelto con due correzioni nel Registro, poi questo viene disattivato.</div>
    <button class="btn sec" id="aMergeBtn">Unisci</button>
  </div>` : ""}
  <h2>Ultimi movimenti di questo articolo</h2><div class="card">${movRows(S.movements.filter(m => m.articoloId === a.id).slice(0, 5)) || '<div class="s">Nessun movimento.</div>'}</div>`;
  $("aBack").onclick = goBack;
  const quick = tipo => run(async () => {
    const q = num($("aQty").value);
    if (!isFinite(q) || q <= 0) throw new Error("Scrivi una quantità valida.");
    const lotto = $("aLot") ? normLot($("aLot").value) : "";
    if ($("aLot") && !lotto) throw new Error("Scrivi il lotto.");
    const ok = await submitMove({ tipo, articoloId: a.id, quantita: q, nota: $("aNota").value.trim(), lotto });
    toast((tipo === "CARICO" ? "Entrata" : "Uscita") + (ok ? " registrata: " : " salvata sul telefono: ") + (tipo === "CARICO" ? "+" : "−") + fmt(q) + (lotto ? " · lotto " + lotto : "") + queued(ok)); vArt();
  });
  if ($("aIn")) { $("aIn").onclick = () => quick("CARICO"); $("aOut").onclick = () => quick("SCARICO"); }
  $("aSave").onclick = () => run(async () => {
    const article = { id: a.id, categoria: a.categoria, nome: tidy($("aNome").value), formato: forms ? $("aFor").value : a.formato,
      unita: forms ? (/^fusto/i.test($("aFor").value) ? "fusti" : "bt") : $("aUni").value, soglia: num($("aSog").value) || 0, attivo: $("aAtt").value === "1" };
    if (!article.nome) throw new Error("Scrivi il nome.");
    if (queue.length) throw new Error("Prima devono partire i movimenti in attesa: riprova quando c'è rete.");
    const dup = S.articles.find(x => x.id !== a.id && artKey(x.nome, x.formato) === artKey(article.nome, article.formato));
    if (dup && article.attivo) throw new Error("Esiste già: " + label(dup) + ". Se sono lo stesso articolo usa \"Unisci\".");
    setBase(await api("saveArticle", { article }));
    toast("Salvato"); vArt();
  });
  if ($("aMergeBtn")) {
    let armed = "";
    $("aMerge").onchange = () => { armed = ""; $("aMergeBtn").textContent = "Unisci"; };
    $("aMergeBtn").onclick = () => run(async () => {
      const t = S.articles.find(x => x.id === $("aMerge").value);
      if (!t) throw new Error("Scegli con quale articolo unirlo.");
      if (queue.length) throw new Error("Prima devono partire i movimenti in attesa: riprova quando c'è rete.");
      if (armed !== t.id) { armed = t.id; $("aMergeBtn").textContent = `Conferma: sposta ${fmt(a.giacenza)} ${a.unita} su ${label(t)}`; return; }
      const parts = hasLot(a) ? lotsOf(a) : (a.giacenza !== 0 ? [["", a.giacenza]] : []);
      for (const [lotto, q] of parts) {
        setBase(await api("move", { tipo: "RETTIFICA", articoloId: a.id, quantita: -q, nota: "Unito in " + label(t), lotto, uid: uid(), quando: new Date().toISOString() }));
        setBase(await api("move", { tipo: "RETTIFICA", articoloId: t.id, quantita: q, nota: "Unito da " + label(a), lotto, uid: uid(), quando: new Date().toISOString() }));
      }
      setBase(await api("saveArticle", { article: { id: a.id, categoria: a.categoria, nome: a.nome, formato: a.formato, unita: a.unita, soglia: a.soglia, attivo: false } }));
      editId = t.id; toast("Articoli uniti"); vArt();
    });
  }
}

/* ---------- MOVIMENTI NON ACCETTATI ---------- */
function vRej() {
  if (!rejected.length) { view = "in"; return render(); }
  $("main").innerHTML = `
  <div class="hint" style="margin-top:0">Questi movimenti erano stati salvati sul telefono, ma all'invio lo script non li ha accettati. <b>Non sono nell'inventario</b>: controlla e, se serve, registrali di nuovo.</div>
  <div class="card" style="margin-top:12px">${rejected.map(r => `<div class="row"><div><div class="t">${esc(r.articolo || "Articolo")}</div>
    <div class="s">${esc(new Date(r.quando).toLocaleString("it-IT", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }))} · ${esc(({ CARICO:"entrata", SCARICO:"uscita", RETTIFICA:"correzione", ARTICOLO:"nuovo articolo" })[r.tipo] || r.tipo)}${r.quantita != null ? " " + fmt(r.quantita) : ""}${r.lotto ? " · lotto " + esc(r.lotto) : ""}${r.nota ? " · " + esc(r.nota) : ""}</div>
    <div class="s low">Motivo: ${esc(r.errore)}</div></div></div>`).join("")}</div>
  <button class="btn sec" id="rOk">Ho controllato, togli l'avviso</button>`;
  $("rOk").onclick = () => { rejected = []; ls.set(RKEY, null); syncBar(); view = "in"; render(); };
}

/* ---------- ESPORTAZIONE ---------- */
function csv(name, rows) {
  const cell = v => { let s = typeof v === "number" ? String(v).replace(".", ",") : String(v ?? ""); if (/^[=+\-@]/.test(s) && typeof v !== "number") s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const blob = new Blob(["﻿" + rows.map(r => r.map(cell).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = name + "_" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- AVVIO ---------- */
function getKey() {
  let k = keyFrom(location.hash);
  try { if (k) localStorage.setItem(KKEY, k); else k = localStorage.getItem(KKEY) || ""; } catch (e) {}
  return k;
}
$("btnAct").onclick = () => {
  const k = keyFrom($("actKey").value);
  if (!k) return toast("Codice non valido.", true);
  try { localStorage.setItem(KKEY, k); } catch (e) {}
  location.hash = "k=" + k;   // resta nel link: così l'icona sulla schermata Home lo conserva
  start();
};
async function start() {
  const k = getKey();
  if (!k) { $("activate").classList.remove("hide"); return; }
  $("activate").classList.add("hide");
  API_URL = "https://script.google.com/macros/s/" + k + "/exec";
  if (!token) return showLogin();
  if (base) { derive(); showApp(); refresh(true); return; }   // si parte dai dati salvati sul telefono, poi si aggiorna
  try { setBase(await api("state")); lastRefresh = Date.now(); showApp(); }
  catch (e) {
    if (!token) return;
    toast(e.message, true); $("login").classList.add("hide"); $("app").classList.remove("hide");
    $("main").innerHTML = '<div class="center">Impossibile caricare i dati.<br>La prima apertura richiede la rete.<br><br><button class="btn sec" onclick="location.reload()">Riprova</button></div>';
  }
}

window.addEventListener("online", () => refresh(true));
window.addEventListener("offline", syncBar);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
setInterval(() => { if (queue.length) flush(); }, 20000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

start();
</script>
